[project]
name = "tinylm-from-scratch"
version = "0.1.0"
description = "A tiny language model built from zero: tokenizer, transformer, pre-training, SFT and DPO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8",
    "tiktoken>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
